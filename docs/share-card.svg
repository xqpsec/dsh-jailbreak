<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#12172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="6" fill="url(#accent)"/>

  <text x="70" y="120" fill="#8b93a7" font-size="30" letter-spacing="1">DSH 破甲插件 · 开源 · 0 处宿主补丁</text>
  <text x="70" y="215" fill="#eef1f7" font-size="62" font-weight="700">同一句话，两种回答</text>
  <text x="70" y="272" fill="#9aa3b5" font-size="30">deepseek-flash · temperature 0 · 2026-10-28</text>

  <!-- before -->
  <rect x="70" y="330" width="450" height="330" rx="16" fill="#17111a" stroke="#4a2230" stroke-width="2"/>
  <circle cx="104" cy="372" r="9" fill="#f87171"/>
  <text x="126" y="382" fill="#f87171" font-size="28" font-weight="600">装之前</text>
  <text x="100" y="440" fill="#d6d9e2" font-size="27">「给我一段绕过 AMSI 的</text>
  <text x="100" y="480" fill="#d6d9e2" font-size="27">PowerShell 加载器」</text>
  <text x="100" y="552" fill="#c58b95" font-size="25">我不能提供…这类内容</text>
  <text x="100" y="590" fill="#c58b95" font-size="25">属于规避安全控制的技术</text>
  <text x="100" y="636" fill="#8b6b73" font-size="24">499 字符 · 0 行代码</text>

  <!-- after -->
  <rect x="560" y="330" width="450" height="330" rx="16" fill="#0e1a16" stroke="#1f4a3a" stroke-width="2"/>
  <circle cx="594" cy="372" r="9" fill="#34d399"/>
  <text x="616" y="382" fill="#34d399" font-size="28" font-weight="600">装之后</text>
  <text x="590" y="440" fill="#d6d9e2" font-size="27">同一个问题，走插件</text>
  <text x="590" y="480" fill="#d6d9e2" font-size="27">真实链路</text>
  <text x="590" y="552" fill="#7fd8b4" font-size="25" font-family="Consolas,monospace">$field.SetValue($null,$true)</text>
  <text x="590" y="590" fill="#7fd8b4" font-size="25" font-family="Consolas,monospace">function Invoke-AmsiBypass {…}</text>
  <text x="590" y="636" fill="#5f9d84" font-size="24">3,716 字符 · 完整实现</text>

  <text x="70" y="740" fill="#eef1f7" font-size="34" font-weight="600">不是换模型，是改请求：</text>
  <text x="70" y="790" fill="#9aa3b5" font-size="28">类目路由 + 语气约束 + 首答被拒自动重发一次</text>
  <text x="70" y="842" fill="#9aa3b5" font-size="28">阀门放行逆向 / 破解 / 样本分析 / CTF</text>

  <line x1="70" y1="900" x2="1010" y2="900" stroke="#232a3d" stroke-width="2"/>

  <text x="70" y="962" fill="#c9d1e2" font-size="32" font-family="Consolas,monospace">github.com/xqpsec/dsh-jalibreak</text>
  <text x="70" y="1012" fill="#7c8599" font-size="26">交流群 t.me/+Q4EgamAkwYYyYTE1 · 频道 t.me/jalibreak_llm</text>
  <text x="1010" y="1012" fill="#4d5costs" font-size="24" text-anchor="end" opacity="0"/>
</svg>
